name: Apply Pi broker tool allowlist fix once

on:
  push:
    branches:
      - agent/self-review-protocol-durability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/self-review-protocol-durability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch and compile
        run: |
          python -m py_compile scripts/patch_pi_broker_tool_allowlist_once.py
          python scripts/patch_pi_broker_tool_allowlist_once.py
          python -m py_compile src/app/agent_runtime/pi_runtime_core.py src/app/agent_runtime/pi_runtime.py src/tests/agent_runtime/test_pi_runtime.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests python-multipart pillow playwright "psycopg[binary]>=3.2.1,<4" "psycopg-pool>=3.2.1,<4"

      - name: Run focused runtime regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            src/tests/agent_runtime/test_pi_runtime.py \
            src/tests/agent_runtime/test_governed_browser_mcp.py \
            src/tests/agent_runtime/test_self_review_protocol_durability.py \
            -q --tb=short

      - name: Commit durable fix and remove one-shot scaffolding
        shell: bash
        run: |
          git rm -f scripts/patch_pi_broker_tool_allowlist_once.py .github/workflows/apply-pi-broker-tool-allowlist-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): keep governed Pi broker tool active"
          git push origin HEAD:agent/self-review-protocol-durability
